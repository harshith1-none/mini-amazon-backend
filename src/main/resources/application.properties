spring.application.name=mini-amazon-backend

server.port=9090

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/amazon}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# CHANGED: was create-drop, which wiped and recreated the entire schema
# (including orders, cart_item, wishlist_item, users) on every restart -
# fine for the first few days of scaffolding, but actively dangerous now
# that orders/cart/wishlist hold real data you care about across restarts.
# "update" makes Hibernate diff the entities against the existing schema
# and only add what's missing (new tables/columns) - it never drops or
# rewrites existing tables or data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Required for data.sql to run correctly against a table created by Hibernate:
# without this, Spring Boot tries to run data.sql BEFORE Hibernate creates the
# schema, causing a "relation does not exist" error on startup.
spring.jpa.defer-datasource-initialization=true

# Postgres is an external (non-embedded) database, so Spring Boot does not run
# data.sql automatically unless explicitly told to.
#
# NOTE (now that ddl-auto is "update", not "create-drop"): this re-runs
# data.sql's INSERT statements on every restart against a table that no
# longer gets wiped first. Product has no unique constraint besides its
# generated id, so this WILL duplicate all 17 seed products on every
# restart until you either set this to "never" after the first successful
# seed, or add a unique constraint + ON CONFLICT DO NOTHING to data.sql.
spring.sql.init.mode=always

# NEW: JWT configuration.
# jwt.secret MUST be a Base64-encoded key with at least 256 bits (32 bytes)
# of entropy for the HS256 algorithm - a short/guessable string here lets an
# attacker forge valid tokens. The default below is a randomly generated key
# for local dev ONLY; in any real deployment this must come from an
# environment variable (same pattern as DB_PASSWORD above), never committed
# to source control.
jwt.secret=${JWT_SECRET: [REDACTED]}

# Token lifetime in milliseconds - 86400000 = 24 hours.
jwt.expiration=${JWT_EXPIRATION:86400000}