spring.application.name=mini-amazon-backend

server.port=9090

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/amazon}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Required for data.sql to run correctly against a table created by Hibernate:
# without this, Spring Boot tries to run data.sql BEFORE Hibernate creates the
# schema, causing a "relation does not exist" error on startup.
spring.jpa.defer-datasource-initialization=true

# Postgres is an external (non-embedded) database, so Spring Boot does not run
# data.sql automatically unless explicitly told to.
spring.sql.init.mode=always

# NOTE: ddl-auto=create-drop wipes and recreates the schema (and reseeds from
# data.sql) on every application restart. This is fine for early development
# but must be changed to "update" or "validate" before this ever touches real
# data, or every restart will silently delete everything in the database.

# NEW: JWT configuration.
# jwt.secret MUST be a Base64-encoded key with at least 256 bits (32 bytes)
# of entropy for the HS256 algorithm - a short/guessable string here lets an
# attacker forge valid tokens. The default below is a randomly generated key
# for local dev ONLY; in any real deployment this must come from an
# environment variable (same pattern as DB_PASSWORD above), never committed
# to source control.
jwt.secret=${JWT_SECRET: [REDACTED]}

# Token lifetime in milliseconds - 86400000 = 24 hours.
jwt.expiration=${JWT_EXPIRATION:86400000}